<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b110d">
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    <link rel="shortcut icon" type="image/x-icon" href="{{ '/rufa.ico' | relative_url }}">
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [['$', '$'], ['\\(', '\\)']],
          displayMath: [['$$', '$$'], ['\\[', '\\]']]
        },
        options: {
          skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
        }
      };
    </script>
    <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    {% seo %}
  </head>

  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>

    <header class="site-header">
      <div class="container">
        <a id="a-title" class="site-title" href="{{ '/' | relative_url }}" aria-label="Home">
          <img class="site-mark" src="{{ '/rufa.ico' | relative_url }}" alt="" aria-hidden="true">
          <span>{{ site.title | default: site.github.repository_name }}</span>
        </a>

        <nav class="site-nav" aria-label="Primary navigation">
          <a href="{{ '/' | relative_url }}#about-me">About</a>
          <a href="{{ '/' | relative_url }}#lecture-notes">Lectures</a>
          <a href="{{ '/' | relative_url }}#beamers">Talks</a>
          <a href="{{ '/' | relative_url }}#research">Research</a>
          <a href="{{ '/' | relative_url }}#some-notes">Notes</a>
        </nav>
      </div>
    </header>

    <main id="main-content" class="container page-shell">
      <section id="main_content">
        {{ content }}
      </section>
    </main>

    <script>
      (function () {
        var terms = Array.prototype.slice.call(document.querySelectorAll('.term-tooltip'));
        var scratchSecrets = Array.prototype.slice.call(document.querySelectorAll('.scratch-secret'));
        var touchQuery = window.matchMedia('(hover: none) and (pointer: coarse)');
        var mobileQuery = window.matchMedia('(max-width: 760px)');

        scratchSecrets.forEach(function (secret) {
          secret.setAttribute('aria-expanded', 'false');
          secret.setAttribute('aria-label', 'Tap to reveal hidden note');

          secret.addEventListener('click', function (event) {
            if (!touchQuery.matches && !mobileQuery.matches) {
              return;
            }

            event.preventDefault();
            var revealed = secret.classList.toggle('is-revealed');
            secret.setAttribute('aria-expanded', String(revealed));
          });

        });

        document.addEventListener('copy', function (event) {
          var selection = window.getSelection ? window.getSelection() : null;
          if (!selection || !selection.rangeCount) {
            return;
          }

          var selectedSecret = scratchSecrets.some(function (secret) {
            var range = selection.getRangeAt(0);
            return range.intersectsNode ? range.intersectsNode(secret) : secret.contains(selection.anchorNode);
          });

          if (selectedSecret) {
            event.preventDefault();
          }
        });

        if (!terms.length) {
          return;
        }

        var isTouchViewport = function () {
          return touchQuery.matches || mobileQuery.matches;
        };

        var setOpen = function (term, open) {
          term.classList.toggle('is-open', open);
          term.setAttribute('aria-expanded', String(open));
        };

        var closeAll = function () {
          terms.forEach(function (term) {
            setOpen(term, false);
          });

          var active = document.activeElement;
          if (active && active.closest && active.closest('.term-tooltip')) {
            active.blur();
          }
        };

        var openTerm = function (term) {
          closeAll();
          setOpen(term, true);
          if (term.focus) {
            term.focus({ preventScroll: true });
          }
        };

        terms.forEach(function (term) {
          term.setAttribute('aria-expanded', 'false');

          term.addEventListener('click', function (event) {
            if (!isTouchViewport()) {
              return;
            }

            var target = event.target;
            var link = target && target.closest ? target.closest('a') : null;

            if (term.classList.contains('term-tooltip--cnrs') && link) {
              if (!term.classList.contains('is-open')) {
                event.preventDefault();
                event.stopPropagation();
                openTerm(term);
              }
              return;
            }

            if (!link) {
              event.preventDefault();
              if (term.classList.contains('is-open')) {
                closeAll();
              } else {
                openTerm(term);
              }
            }
          });

          term.addEventListener('keydown', function (event) {
            if (event.key === 'Escape') {
              closeAll();
            }
          });
        });

        document.addEventListener('pointerdown', function (event) {
          if (!isTouchViewport()) {
            return;
          }

          var target = event.target;
          if (!target || !target.closest || !target.closest('.term-tooltip')) {
            closeAll();
          }
        });
      }());
    </script>

    {% if site.google_analytics %}
      <script>
        (function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){
        (i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o),
        m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m)
        })(window,document,'script','//www.google-analytics.com/analytics.js','ga');
        ga('create', '{{ site.google_analytics }}', 'auto');
        ga('send', 'pageview');
      </script>
    {% endif %}
  </body>
</html>
